name: CI

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Cache node_modules
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

  gen-api-check:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: "npm"

      - name: Restore node_modules
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline && npm run build:shared

      - name: Generate API clients
        run: npm run gen:api

      - name: Verify generated code is up to date
        run: |
          git add -N src/fxtwitter/generated src/vxtwitter/generated
          if ! git diff --exit-code -- src/fxtwitter/generated src/vxtwitter/generated; then
            echo "::error::生成物が最新ではありません。'npm run gen:api' を実行してコミットしてください"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: "npm"

      - name: Restore node_modules
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build shared package
        # キャッシュされた dist が shared のソース変更に追従しないため、常に再ビルドする
        run: npm run build:shared

      - name: Run oxlint
        run: npx oxlint src/ tests/

      - name: Run oxfmt (format check)
        run: npx oxfmt --check src/

      - name: Type-check (compile gate)
        run: npm run compile:test

      - name: Type-check tests
        run: npm run compile:tests

      - name: Run all tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f #v7.0.0
        with:
          files: ./coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-redis:
    runs-on: ubuntu-latest
    needs: setup

    services:
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: "npm"

      - name: Restore node_modules
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build shared package
        run: npm run build:shared

      # tests/integration のテストは全て明示フラグでゲートされているため、
      # ディレクトリ指定でよい。RUN_REDIS_INTEGRATION だけを立てるので、
      # 実 API を叩くテスト（RUN_LIVE_API_TESTS）は skipped のまま残る。
      # ファイル名を列挙しないことで、テスト追加時に CI への追記を忘れても
      # 実行対象から漏れない。
      - name: Run Redis integration tests
        run: npx vitest run tests/integration
        env:
          RUN_REDIS_INTEGRATION: "1"
          REDIS_URL: redis://localhost:6379

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: "npm"

      - name: Restore node_modules
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline && npm run build:shared

      - name: Build TypeScript
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful"
